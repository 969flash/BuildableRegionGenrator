<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서울 정북사선 시뮬레이션 3D 맵</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

  .panel {
    position: absolute;
    z-index: 10;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    font-size: 13px;
  }
  .panel h3 { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; }
  .panel label { display: block; margin: 8px 0 4px; color: #444; font-weight: 500; }
  .panel .row { margin: 6px 0; }
  .panel button {
    border: 1px solid #ccc; background: #fff; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .panel button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .panel input[type="range"] { width: 200px; vertical-align: middle; }

  .controls { top: 16px; left: 16px; min-width: 240px; }
  .legend { bottom: 16px; right: 16px; }
  .legend .swatch { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }

  /* 좌측 층별 면적표 패널 (controls 아래) */
  .info { top: 210px; left: 16px; width: 280px; display: none; }
  .info .pnu { font-size: 11px; color: #888; margin-bottom: 8px; word-break: break-all; }
  .info table.area { border-collapse: collapse; width: 100%; font-size: 12px; }
  .info table.area th { background: #f3f4f6; padding: 4px 6px; font-weight: 600; text-align: right; border-bottom: 1px solid #ddd; }
  .info table.area th:first-child { text-align: center; }
  .info table.area td { padding: 3px 6px; text-align: right; border-bottom: 1px solid #f0f0f0; }
  .info table.area td:first-child { text-align: center; color: #777; font-weight: 500; }
  .info table.area td.pos { color: #1a7f37; }
  .info table.area td.neg { color: #cf222e; }
  .info .close-btn { position: absolute; top: 12px; right: 12px; cursor: pointer; color: #999; font-size: 16px; }

  .badge { display: inline-block; background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 11px; color: #555; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel controls">
  <h3>정북사선 시뮬</h3>

  <div class="row">
    <label>시나리오</label>
    <button id="btn-type1" class="active">현행 (Type 1)</button>
    <button id="btn-type2">제안 (Type 2)</button>
  </div>

  <div class="row">
    <label>표시 층: <span id="floor-label">1–7층 전체</span></label>
    <input type="range" id="floor-slider" min="0" max="7" value="0" />
    <small style="color:#888">0 = 전체</small>
  </div>

  <div class="row">
    <label><input type="checkbox" id="show-parcel" checked /> 필지 외곽선</label>
  </div>
</div>

<div class="panel legend">
  <h3>층별 높이</h3>
  <div><span class="swatch" style="background:#f7fbff"></span>1층 (0–3m)</div>
  <div><span class="swatch" style="background:#deebf7"></span>2층 (3–6m)</div>
  <div><span class="swatch" style="background:#9ecae1"></span>3층 (6–9m)</div>
  <div><span class="swatch" style="background:#6baed6"></span>4층 (9–12m)</div>
  <div><span class="swatch" style="background:#3182bd"></span>5층 (12–15m)</div>
  <div><span class="swatch" style="background:#08519c"></span>6층 (15–18m)</div>
  <div><span class="swatch" style="background:#08306b"></span>7층 (18–21m)</div>
</div>

<div class="panel info" id="info">
  <span class="close-btn" id="info-close">✕</span>
  <h3>층별 가용 면적 (㎡)</h3>
  <div class="pnu" id="info-pnu"></div>
  <table class="area">
    <thead>
      <tr><th>층</th><th>현행</th><th>제안</th><th>Δ</th></tr>
    </thead>
    <tbody id="info-tbody"></tbody>
  </table>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.1.0/dist/pmtiles.js"></script>
<script>
  // ===== PMTiles 소스 (deploy.sh가 자동 갱신) =====
  // PMTILES_SOURCES_AUTO_BEGIN
  const PMTILES_SOURCES = [
    { id: "11110", url: "./buildable_11110.pmtiles", name: "종로구" },
    { id: "11140", url: "./buildable_11140.pmtiles", name: "중구" },
    { id: "11170", url: "./buildable_11170.pmtiles", name: "용산구" },
    { id: "11200", url: "./buildable_11200.pmtiles", name: "성동구" },
    { id: "11215", url: "./buildable_11215.pmtiles", name: "광진구" },
    { id: "11230", url: "./buildable_11230.pmtiles", name: "동대문구" },
    { id: "11260", url: "./buildable_11260.pmtiles", name: "중랑구" },
    { id: "11290", url: "./buildable_11290.pmtiles", name: "성북구" },
    { id: "11305", url: "./buildable_11305.pmtiles", name: "강북구" },
    { id: "11320", url: "./buildable_11320.pmtiles", name: "도봉구" },
    { id: "11350", url: "./buildable_11350.pmtiles", name: "노원구" },
    { id: "11380", url: "./buildable_11380.pmtiles", name: "은평구" },
    { id: "11410", url: "./buildable_11410.pmtiles", name: "서대문구" },
    { id: "11440", url: "./buildable_11440.pmtiles", name: "마포구" },
    { id: "11470", url: "./buildable_11470.pmtiles", name: "양천구" },
    { id: "11500", url: "./buildable_11500.pmtiles", name: "강서구" },
    { id: "11530", url: "./buildable_11530.pmtiles", name: "구로구" },
    { id: "11545", url: "./buildable_11545.pmtiles", name: "금천구" },
    { id: "11560", url: "./buildable_11560.pmtiles", name: "영등포구" },
    { id: "11590", url: "./buildable_11590.pmtiles", name: "동작구" },
    { id: "11620", url: "./buildable_11620.pmtiles", name: "관악구" },
    { id: "11650", url: "./buildable_11650.pmtiles", name: "서초구" },
    { id: "11680", url: "./buildable_11680.pmtiles", name: "강남구" },
    { id: "11710", url: "./buildable_11710.pmtiles", name: "송파구" },
    { id: "11740", url: "./buildable_11740.pmtiles", name: "강동구" },
  ];
  // PMTILES_SOURCES_AUTO_END

  // ===== PMTiles 프로토콜 등록 =====
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  // ===== 베이스맵 + 모든 PMTiles 소스 =====
  const initialSources = {
    osm: {
      type: "raster",
      tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      tileSize: 256,
      attribution: "© OpenStreetMap contributors",
      maxzoom: 19,
    },
  };
  PMTILES_SOURCES.forEach(({ id, url }) => {
    initialSources[`buildable_${id}`] = {
      type: "vector",
      url: "pmtiles://" + url,
    };
  });

  // 초기 포커스 필지 (역삼동, 강남구 1168010100108100010)
  const TARGET_CENTER = [127.026526, 37.503069];

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
      sources: initialSources,
      layers: [{ id: "osm", type: "raster", source: "osm" }],
    },
    center: TARGET_CENTER,
    zoom: 17.5,
    pitch: 60,
    bearing: 90,   // 중심점 기준 오른쪽 90도 회전
    maxPitch: 75,
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: true, visualizePitch: true }));

  // ===== 상태 =====
  let currentType = 1;     // 1 = 현행, 2 = 제안
  let floorOnly = 0;       // 0 = 전체, 1~7 = 특정 층만
  const FLOORS = [1, 2, 3, 4, 5, 6, 7];
  // 층별 색상 (한 층 = 한 슬라브로 구분되게)
  const FLOOR_COLORS = {
    1: "#f7fbff",
    2: "#deebf7",
    3: "#9ecae1",
    4: "#6baed6",
    5: "#3182bd",
    6: "#08519c",
    7: "#08306b",
  };
  // 모든 layer id (구 × 층 = 25 × 7 = 175개)
  const LAYER_IDS = [];
  PMTILES_SOURCES.forEach(({ id }) => {
    FLOORS.forEach(f => LAYER_IDS.push(`buildable_${id}_f${f}`));
  });

  // ===== 모든 PMTiles × 7층 fill-extrusion layer 추가 =====
  // dedup된 record(예: floor_from=1, floor_to=3)도 층별로 3개 슬라브로 분리되어 보임
  map.on("load", () => {
    PMTILES_SOURCES.forEach(({ id }) => {
      FLOORS.forEach(f => {
        map.addLayer({
          id: `buildable_${id}_f${f}`,
          type: "fill-extrusion",
          source: `buildable_${id}`,
          "source-layer": "buildable",
          paint: {
            // 이 layer는 "f층 슬라브" 전용 -- base/top 고정
            "fill-extrusion-base": (f - 1) * 3,
            "fill-extrusion-height": f * 3,
            "fill-extrusion-color": FLOOR_COLORS[f],
            "fill-extrusion-opacity": 0.85,
            // 살짝의 vertical gradient는 MapLibre 미지원이라 색상으로만 분리
          },
        });
      });
    });

    // ===== 선택 강조 source + layers =====
    map.addSource("selection", {
      type: "geojson",
      data: { type: "FeatureCollection", features: [] },
    });
    // 바닥 footprint 볼드 아웃라인
    map.addLayer({
      id: "selection-outline",
      type: "line",
      source: "selection",
      paint: {
        "line-color": "#ff3b30",
        "line-width": 4,
        "line-opacity": 0.95,
      },
    });
    // 3D 강조 기둥 (선택 건물 전체 높이를 빨강 반투명으로 감쌈)
    map.addLayer({
      id: "selection-extrude",
      type: "fill-extrusion",
      source: "selection",
      paint: {
        "fill-extrusion-base": 0,
        "fill-extrusion-height": ["get", "_height"],
        "fill-extrusion-color": "#ff3b30",
        "fill-extrusion-opacity": 0.25,
      },
    });

    applyFilter();
  });

  function applyFilter() {
    PMTILES_SOURCES.forEach(({ id }) => {
      FLOORS.forEach(f => {
        const lid = `buildable_${id}_f${f}`;
        if (!map.getLayer(lid)) return;

        // 이 layer가 표시될 record: type 일치 + 이 record의 floor 범위가 f를 포함
        const filter = ["all",
          ["==", ["get", "type"], currentType],
          ["<=", ["get", "floor_from"], f],
          [">=", ["get", "floor_to"], f],
        ];
        map.setFilter(lid, filter);

        // floorOnly로 특정 층만 보기 모드
        const visible = (floorOnly === 0) || (floorOnly === f);
        map.setLayoutProperty(lid, "visibility", visible ? "visible" : "none");
      });
    });
  }

  // ===== UI 이벤트 =====
  document.getElementById("btn-type1").addEventListener("click", (e) => {
    currentType = 1;
    document.getElementById("btn-type1").classList.add("active");
    document.getElementById("btn-type2").classList.remove("active");
    applyFilter();
  });
  document.getElementById("btn-type2").addEventListener("click", (e) => {
    currentType = 2;
    document.getElementById("btn-type1").classList.remove("active");
    document.getElementById("btn-type2").classList.add("active");
    applyFilter();
  });

  const slider = document.getElementById("floor-slider");
  const floorLabel = document.getElementById("floor-label");
  slider.addEventListener("input", (e) => {
    floorOnly = parseInt(e.target.value);
    floorLabel.textContent = floorOnly === 0
      ? "1–7층 전체"
      : `${floorOnly}층만 (${(floorOnly-1)*3}–${floorOnly*3}m)`;
    applyFilter();
  });

  // ===== 선택 상태 =====
  let selected = null;  // { pnu, districtId }

  function selectParcel(pnu, districtId) {
    selected = { pnu, districtId };
    const sourceId = `buildable_${districtId}`;

    // 이 PNU의 모든 record 조회 (type1 + type2, 모든 층 범위)
    const feats = map.querySourceFeatures(sourceId, {
      sourceLayer: "buildable",
      filter: ["==", ["get", "pnu"], pnu],
    });

    if (!feats.length) return;

    // type별 floor별 면적 매핑
    const byType = { 1: {}, 2: {} };
    let footprint = null;       // 1층 footprint geometry (강조용)
    let zone = "", district = "", maxFloor = 0;
    feats.forEach(f => {
      const p = f.properties;
      const t = p.type;
      for (let fl = p.floor_from; fl <= p.floor_to; fl++) {
        byType[t][fl] = p.area_m2;
      }
      maxFloor = Math.max(maxFloor, p.floor_to);
      if (p.floor_from === 1 && !footprint) footprint = f.geometry;
      zone = p.zone_cd; district = p.district;
    });
    if (!footprint && feats[0]) footprint = feats[0].geometry;

    // --- 선택 강조 (footprint outline + 실제 높이 강조 기둥) ---
    map.getSource("selection").setData({
      type: "FeatureCollection",
      features: footprint ? [{
        type: "Feature",
        geometry: footprint,
        properties: { _height: Math.max(maxFloor, 1) * 3 },
      }] : [],
    });

    // --- 층별 면적표 렌더 ---
    const tbody = document.getElementById("info-tbody");
    let rows = "";
    for (let fl = 1; fl <= 7; fl++) {
      const a1 = byType[1][fl];
      const a2 = byType[2][fl];
      const s1 = (a1 != null) ? a1.toFixed(1) : "–";
      const s2 = (a2 != null) ? a2.toFixed(1) : "–";
      let dCell = "<td>–</td>";
      if (a1 != null && a2 != null) {
        const d = a2 - a1;
        const cls = d > 0.05 ? "pos" : (d < -0.05 ? "neg" : "");
        const sign = d > 0 ? "+" : "";
        dCell = `<td class="${cls}">${sign}${d.toFixed(1)}</td>`;
      }
      rows += `<tr><td>${fl}층</td><td>${s1}</td><td>${s2}</td>${dCell}</tr>`;
    }
    tbody.innerHTML = rows;
    document.getElementById("info-pnu").textContent =
      `PNU ${pnu} · ${district} · 용도지역 ${zone}`;
    document.getElementById("info").style.display = "block";
  }

  // ===== 클릭 핸들러 (모든 buildable layer) =====
  map.on("load", () => {
    LAYER_IDS.forEach(lid => {
      map.on("click", lid, (e) => {
        if (!e.features || !e.features[0]) return;
        const props = e.features[0].properties;
        const districtId = lid.split("_")[1];  // buildable_11680_f3 -> 11680
        selectParcel(props.pnu, districtId);
      });
      map.on("mouseenter", lid, () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", lid, () => map.getCanvas().style.cursor = "");
    });
  });

  // 닫기 버튼
  document.getElementById("info-close").addEventListener("click", () => {
    document.getElementById("info").style.display = "none";
    selected = null;
    if (map.getSource("selection")) {
      map.getSource("selection").setData({ type: "FeatureCollection", features: [] });
    }
  });
</script>
</body>
</html>
